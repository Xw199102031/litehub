# HTTP
quarkus.http.port=8080

# Application info
quarkus.application.name=litehub
quarkus.application.version=0.1.0-SNAPSHOT

# OpenAPI
quarkus.smallrye-openapi.path=/q/openapi

# Datasource (示例：可按需替换为实际数据库)
quarkus.datasource.db-kind=postgresql
