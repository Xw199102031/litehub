# ===== HTTP 服务 =====

# 服务监听端口
quarkus.http.port=8080

# 应用名称
quarkus.application.name=litehub

# 应用版本号
quarkus.application.version=0.1.0-SNAPSHOT

# ===== OpenAPI / Swagger =====

# OpenAPI 文档的访问路径
quarkus.smallrye-openapi.path=/q/openapi

# ===== JWT 鉴权校验（使用公钥验签） =====

# 用于验签的 JWT 公钥文件位置
mp.jwt.verify.publickey.location=classpath:keys/public.pem

# 签发者（issuer）校验，需与签发 token 时的 issuer 保持一致
mp.jwt.verify.issuer=litehub

# ===== MySQL 数据源 =====

# 数据库类型
quarkus.datasource.db-kind=mysql

# 数据库用户名（可通过环境变量 QUARKUS_DATASOURCE_USERNAME 覆盖）
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:root}

# 数据库密码（必须通过环境变量 QUARKUS_DATASOURCE_PASSWORD 注入，禁止硬编码提交）
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:}

# JDBC 连接地址（可通过环境变量 QUARKUS_DATASOURCE_JDBC_URL 覆盖，默认指向本地开发库）
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:mysql://localhost:3306/litehub}

# ===== Hibernate ORM =====

# 不通过 Hibernate 自动生成/更新表结构，交由 Flyway 管理
quarkus.hibernate-orm.database.generation=none

# 打印执行的 SQL 语句，便于调试
quarkus.hibernate-orm.log.sql=true

# ===== Flyway 数据库迁移 =====

# 应用启动时自动执行数据库迁移
quarkus.flyway.migrate-at-start=true

# 迁移脚本所在目录
quarkus.flyway.locations=classpath:db/migration

# ===== Casbin 权限策略 =====

# Casbin 策略文件路径（可通过环境变量 CASBIN_POLICY_PATH 覆盖）
casbin.policy.path=${CASBIN_POLICY_PATH:config/casbin/policy.csv}